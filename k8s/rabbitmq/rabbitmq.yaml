apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: nexus-production
spec:
  serviceName: 'rabbitmq-service'
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets


---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: nexus-production
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672