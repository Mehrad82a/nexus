apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexus-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: nexus/auth-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          readinessProbe:
            httpGet:
              path: /health/
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
