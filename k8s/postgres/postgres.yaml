apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nexus-production
spec:
  serviceName: 'postgres-service'
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: nexus-production
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432