worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Zone: 100 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    upstream auth_upstream {
        server auth-service:8001;
    }

    upstream product_upstream {
        server product-service:8002;
    }

    upstream order_upstream {
        server order-service:8003;
    }

    upstream payment_upstream {
        server payment-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gateway Health Check
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"nexus-api-gateway"}';
        }

        # 1. Identity & Authentication Service
        location /api/v1/auth/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://auth_upstream;
        }

        # 2. Product & Inventory Catalog Service
        location /api/v1/catalog/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://product_upstream;
        }

        # 3. Order Processing Service
        location /api/v1/orders/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://order_upstream;
        }

        # 4. Async Payment Service (FastAPI)
        location /api/v1/payments/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://payment_upstream;
        }
    }
}